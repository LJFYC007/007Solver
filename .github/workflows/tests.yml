name: Solver tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Release
        run: cmake --preset windows-msvc-release

      - name: Build tests
        run: cmake --build --preset windows-msvc-release --target 007SolverTests

      - name: Run tests
        run: ctest --test-dir build/windows-msvc-release --output-on-failure
