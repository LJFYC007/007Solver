[package]
name = "solver007"
version = "0.1.0"
description = "A desktop poker solver with live strategy exploration"
authors = ["007 Solver"]
edition = "2021"

[[bin]]
name = "007solver"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "sync", "time"] }
